name: test_175-fog-snipex

on:
  workflow_dispatch:

jobs:
  build:
    name: Build test_175-fog-snipex
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            git gnupg gperf libelf-dev libncurses5-dev libssl-dev lzop make \
            optipng pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libtinfo5

      - name: Download AOSP Toolchains (Clang + Binutils)
        run: |
          mkdir -p clang gcc64 gcc32
          
          # AOSP Clang r383902
          curl -fLO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r35/clang-r383902.tar.gz
          tar -xf clang-r383902.tar.gz -C clang
          rm -f clang-r383902.tar.gz

          # AOSP GCC 64-bit (Binutils)
          curl -fLO https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-11.0.0_r35.tar.gz
          tar -xf android-11.0.0_r35.tar.gz -C gcc64
          rm -f android-11.0.0_r35.tar.gz

          # AOSP GCC 32-bit (Binutils)
          curl -fLO https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-11.0.0_r35.tar.gz
          tar -xf android-11.0.0_r35.tar.gz -C gcc32
          rm -f android-11.0.0_r35.tar.gz

      - name: Build test_175-fog-snipex
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang/bin:${GITHUB_WORKSPACE}/gcc64/bin:${GITHUB_WORKSPACE}/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          # Defconfig Load
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- vendor/fog-perf_defconfig

          # Compile Only Image.gz
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            Image.gz

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test_175-fog-snipex-Output
          path: out/arch/arm64/boot/Image.gz
          
